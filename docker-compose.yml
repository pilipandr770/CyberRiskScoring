# Port bindings are overridable per-environment: on a shared host, set
# RISK_SCANNER_PORT_MAPPING / NIS2_STORE_PORT_MAPPING in the local .env to
# something like "127.0.0.1:8000:8000" to avoid colliding with other
# projects' ports or exposing anything before Traefik/TLS is wired up.
# Local dev defaults keep the previous plain host-port behavior.
services:
  risk-scanner:
    build: ./services/risk-scanner
    ports:
      - "${RISK_SCANNER_PORT_MAPPING:-8000:8000}"
    env_file:
      - .env
    volumes:
      - risk_scanner_data:/app/data
    # Traefik routing — inert unless TRAEFIK_ENABLE=true is set (production
    # host only). RISK_SCANNER_DOMAIN/cfdns cert resolver match the
    # convention already used by this host's other projects.
    #
    # /api/* (the machine API nis2-store's microservice_client talks to) is
    # deliberately NOT reachable through this public router — nis2-store
    # calls it over the internal docker network (http://risk-scanner:8000)
    # instead, so nothing legitimate needs it exposed publicly. A second,
    # higher-priority router matches Host+PathPrefix(/api) and attaches an
    # ipallowlist middleware with an unreachable source range, so any public
    # request to /api/* gets a 403 before it reaches the app (the app's own
    # X-API-Key check on those routes stays as defense in depth).
    labels:
      - "traefik.enable=${RISK_SCANNER_TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.cyberriskscoring.rule=Host(`${RISK_SCANNER_DOMAIN:-cyberriskscoring.localhost}`)"
      - "traefik.http.routers.cyberriskscoring.entrypoints=websecure"
      - "traefik.http.routers.cyberriskscoring.tls.certresolver=cfdns"
      - "traefik.http.services.cyberriskscoring.loadbalancer.server.port=8000"
      - "traefik.http.routers.cyberriskscoring-api-block.rule=Host(`${RISK_SCANNER_DOMAIN:-cyberriskscoring.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cyberriskscoring-api-block.entrypoints=websecure"
      - "traefik.http.routers.cyberriskscoring-api-block.tls.certresolver=cfdns"
      - "traefik.http.routers.cyberriskscoring-api-block.priority=100"
      - "traefik.http.routers.cyberriskscoring-api-block.service=cyberriskscoring"
      - "traefik.http.routers.cyberriskscoring-api-block.middlewares=cyberriskscoring-block-public-api"
      - "traefik.http.middlewares.cyberriskscoring-block-public-api.ipallowlist.sourcerange=127.0.0.1/32"

  nis2-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nis2_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NIS2_POSTGRES_PASSWORD:-postgres}
    volumes:
      - nis2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nis2-store:
    build: ./services/nis2-store
    ports:
      - "${NIS2_STORE_PORT_MAPPING:-5000:5000}"
    env_file:
      - .env.nis2store
    depends_on:
      nis2-postgres:
        condition: service_healthy
    # Disabled until a domain is picked for the client portal — avoids
    # Traefik attempting (and failing) an ACME cert request for a
    # placeholder host.
    labels:
      - "traefik.enable=${NIS2_STORE_TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.cyberriskscoring-portal.rule=Host(`${NIS2_STORE_DOMAIN:-cyberriskscoring-portal.localhost}`)"
      - "traefik.http.routers.cyberriskscoring-portal.entrypoints=websecure"
      - "traefik.http.routers.cyberriskscoring-portal.tls.certresolver=cfdns"
      - "traefik.http.services.cyberriskscoring-portal.loadbalancer.server.port=5000"

volumes:
  risk_scanner_data:
  nis2_postgres_data:
